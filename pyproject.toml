[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqbot"
version = "0.1.0"
description = "NQ/MNQ VWAP research, backtesting and live trading system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "numba>=0.59",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
data = ["databento>=0.40"]
live = ["ib_async>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: long-running benchmark tests (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["nqbot"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
